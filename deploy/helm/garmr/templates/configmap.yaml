apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "garmr.fullname" . }}-config
  labels:
    {{- include "garmr.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ toYaml .Values.config | indent 4 }}
{{- if .Values.policies.inline }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "garmr.fullname" . }}-policies
  labels:
    {{- include "garmr.labels" . | nindent 4 }}
data:
{{- range $k, $v := .Values.policies.inline }}
  {{ $k }}: |
{{ $v | indent 4 }}
{{- end }}
{{- end }}
