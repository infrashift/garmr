# Garmr Server Configuration
# Copy to config.yaml and customize

# Server address
http_addr: ":8080"

# Policy configuration
policy_dir: "/etc/garmr/policies"

# Transport security
# Garmr serves plain HTTP only. TLS — including mTLS — is the service mesh's
# job: Consul Connect terminates mTLS at the sidecar and forwards the
# verified identity (see auth.identity_header below and
# deploy/helm/garmr/examples/consul-connect/). Deploying outside a mesh?
# Front the server with a TLS-terminating proxy.

# Logging configuration
log:
  level: "info"     # debug, info, warn, error
  format: "json"    # json, console

# Evaluation posture
# When require_match is true (the default), any eval that matches zero
# policies returns DENY with a synthetic "no policy matched" result,
# rather than silently allowing it. Set to false to restore the legacy
# fail-open behavior — only do this if you knowingly evaluate inputs that
# no policy targets.
evaluation:
  require_match: true

# Audit logging
audit:
  enabled: true
  path: "/var/log/garmr/audit.log"

# Authentication & caller identity
# - api_key: if set, callers must present this value in api_key_header or
#   as "Authorization: Bearer <key>". Intended for out-of-mesh callers.
# - identity_header: when Garmr runs behind a sidecar that terminates mTLS
#   (Envoy / Consul Connect / Istio), the proxy forwards the verified client
#   identity here. Garmr parses the SPIFFE URI from the XFCC format and
#   stores it on audit entries as "principal". Leave the header at its
#   default unless your mesh uses a different name.
auth:
  api_key: ""
  api_key_header: "X-API-Key"
  identity_header: "X-Forwarded-Client-Cert"

# Storage backend configuration
# By default, --policy-dir is used (filesystem backend).
#
# storage:
#   type: "filesystem"   # the only implemented backend
#   root: "/etc/garmr/policies"
#
# To serve policies from object storage, sync them to disk first — an init
# container running `mc mirror` / `aws s3 sync`, or a CSI volume — and point
# `root` (or --policy-dir) at the result. That keeps credential handling,
# retries and rotation in tooling built for it.

# Rate limiting (optional)
# rate_limit:
#   enabled: false
#   rps: 100
#   burst: 200
#   # X-Forwarded-For is ignored unless the immediate peer is listed here,
#   # otherwise any caller can rotate the header to get a fresh bucket.
#   trusted_proxies: []

# Development mode (optional)
# dev: true  # Enables colored console output