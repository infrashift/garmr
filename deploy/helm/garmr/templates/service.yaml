apiVersion: v1
kind: Service
metadata:
  name: {{ include "garmr.fullname" . }}
  labels:
    {{- include "garmr.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ include "garmr.portName" . }}
      protocol: TCP
      name: {{ include "garmr.portName" . }}
  selector:
    {{- include "garmr.selectorLabels" . | nindent 4 }}
