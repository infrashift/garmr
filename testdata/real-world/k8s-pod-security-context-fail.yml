---
kind: Pod
apiVersion: v1
metadata:
  name: legacy-worker
  namespace: default
spec:
  containers:
  - name: app
    image: nginx:latest
    securityContext:
      runAsNonRoot: false
      privileged: true
      readOnlyRootFilesystem: false
  - name: debug
    image: docker.io/busybox:1.36
    securityContext:
      privileged: false
