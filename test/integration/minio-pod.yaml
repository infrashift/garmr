apiVersion: v1
kind: Pod
metadata:
  name: garmr-minio-test
spec:
  containers:
  - name: minio
    image: quay.io/minio/minio:latest
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    env:
    - name: MINIO_ROOT_USER
      value: "minioadmin"
    - name: MINIO_ROOT_PASSWORD
      value: "minioadmin"
    ports:
    - containerPort: 9000
      hostPort: 9000
    - containerPort: 9001
      hostPort: 9001
